services:
  - type: web
    name: faxnova-backend
    env: node
    plan: free
    region: oregon

    rootDir: .
    buildCommand: npm install
    startCommand: node server.js

    runtime:
      nodeVersion: 20

    autoDeploy: true

    build:
      noCache: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGO_URI
        sync: false

      - key: JWT_ADMIN_SECRET
        sync: false

      - key: WEBHOOK_SECRET_2026_05
        sync: false

      - key: DEBUG_RESIDENCY
        value: "false"

    healthCheckPath: /health

    buildFilter:
      paths:
        - src/**
        - package.json
        - package-lock.json
        - server.js
        - render.yaml
