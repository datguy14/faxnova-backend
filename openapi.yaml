openapi: 3.1.0
info:
  title: FaxNova API
  description: |
    Production-ready Multi-Provider Fax API Backend
    
    Supports **Sinch** and **Telnyx** with automatic fallback, unified interface, 
    and provider-aware status tracking. Perfect for healthcare, legal, finance, 
    and regulated document delivery.
  version: "1.1.0"
  contact:
    name: FaxNova Support
    email: support@faxnova.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development Server
  - url: https://api.faxnova.com
    description: Production Server

paths:
  /fax/send:
    post:
      summary: Send a Fax
      description: Send a fax using the configured provider (Sinch or Telnyx) with optional override.
      tags:
        - Fax
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - fileUrl
              properties:
                to:
                  type: string
                  example: "+15551234567"
                  description: Destination phone number in E.164 format
                fileUrl:
                  type: string
                  format: url
                  example: "https://example.com/document.pdf"
                  description: Publicly accessible URL of the PDF/document
                from:
                  type: string
                  example: "+15557654321"
                  description: Sender fax number (optional - uses provider default)
                provider:
                  type: string
                  enum: [sinch, telnyx]
                  example: "telnyx"
                  description: Optional provider override. Defaults to DEFAULT_FAX_PROVIDER
      responses:
        '200':
          description: Fax successfully queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  faxId:
                    type: string
                    format: uuid
                  providerFaxId:
                    type: string
                  provider:
                    type: string
                    enum: [sinch, telnyx]
                  status:
                    type: string
                    example: "queued"
                  correlationId:
                    type: string
        '400':
          description: Bad Request
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error

  /fax/status/{id}:
    get:
      summary: Get Fax Status
      description: Retrieve the current status of a fax (provider-aware)
      tags:
        - Fax
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Internal FaxNova fax ID
      responses:
        '200':
          description: Fax status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  faxId:
                    type: string
                  providerFaxId:
                    type: string
                  provider:
                    type: string
                  status:
                    type: string
                    enum: [queued, sending, delivered, failed]
                  details:
                    type: object
        '404':
          description: Fax not found

  /fax/providers:
    get:
      summary: List Available Providers
      description: Returns configured providers and routing settings
      tags:
        - Configuration
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Provider configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  defaultProvider:
                    type: string
                  availableProviders:
                    type: array
                    items:
                      type: string
                  fallbackEnabled:
                    type: boolean

  /fax/webhook:
    post:
      summary: Webhook Receiver
      description: Receives normalized webhooks from Sinch or Telnyx
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook received successfully

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Your FaxNova API Key

tags:
  - name: Fax
    description: Fax sending and status operations
  - name: Configuration
    description: System configuration and provider info
  - name: Webhooks
    description: Inbound webhook handling
