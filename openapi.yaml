openapi: 3.1.0
info:
  title: FaxNova API
  description: |
    Production-ready Multi-Provider Fax API Backend

    Supports Sinch and Telnyx with automatic fallback, unified interface,
    residency-aware routing, and provider-aware status tracking.
    Designed for healthcare, legal, finance, and regulated document delivery.
  version: "1.1.0"
  contact:
    name: FaxNova Support
    email: support@faxnova.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development Server
  - url: https://api.faxnova.com
    description: Production Server

tags:
  - name: Fax
    description: Fax sending and status operations
  - name: Configuration
    description: System configuration and provider info
  - name: Webhooks
    description: Inbound webhook handling
  - name: Auth
    description: Authentication and user management
  - name: Agents
    description: AI-powered internal agents (audit, routing, troubleshooting)

paths:
  /fax/send:
    post:
      summary: Send a Fax
      description: Send a fax using the configured provider (Sinch or Telnyx) with optional override and residency-aware routing.
      tags:
        - Fax
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFaxRequest'
      responses:
        '200':
          description: Fax successfully queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendFaxResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fax/status/{id}:
    get:
      summary: Get Fax Status
      description: Retrieve the current status of a fax (provider-aware, residency-aware).
      tags:
        - Fax
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Internal FaxNova fax ID
      responses:
        '200':
          description: Fax status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaxStatusResponse'
        '404':
          description: Fax not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fax:
    get:
      summary: List Faxes
      description: List faxes for the authenticated tenant with optional filters.
      tags:
        - Fax
      security:
        - ApiKeyAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, sending, delivered, failed]
        - name: provider
          in: query
          schema:
            type: string
            enum: [sinch, telnyx]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Fax list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaxListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fax/{id}:
    delete:
      summary: Delete Fax
      description: Soft-delete or cancel a fax, depending on status.
      tags:
        - Fax
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fax deleted or cancel requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFaxResponse'
        '404':
          description: Fax not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fax/providers:
    get:
      summary: List Available Providers
      description: Returns configured providers, routing settings, and residency-aware constraints.
      tags:
        - Configuration
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Provider configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfigResponse'

  /fax/webhook:
    post:
      summary: Webhook Receiver
      description: Receives normalized webhooks from Sinch or Telnyx. Used for delivery status updates.
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Webhook received successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAckResponse'

  /auth/login:
    post:
      summary: Login
      description: Authenticate a user and return a JWT.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      summary: Register
      description: Register a new user account.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /agents/audit-code:
    post:
      summary: Run Code Audit Agent
      description: Submit code or repository metadata to the Audit Agent for automated analysis.
      tags:
        - Agents
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditAgentRequest'
      responses:
        '200':
          description: Audit results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAgentResponse'

  /agents/route:
    post:
      summary: Run Routing Agent
      description: Request a routing decision for a fax based on residency, provider performance, and tier.
      tags:
        - Agents
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingAgentRequest'
      responses:
        '200':
          description: Routing decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingAgentResponse'

  /agents/troubleshoot:
    post:
      summary: Run Troubleshooting Agent
      description: Request troubleshooting guidance for a failed or degraded fax delivery.
      tags:
        - Agents
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TroubleshootingAgentRequest'
      responses:
        '200':
          description: Troubleshooting insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TroubleshootingAgentResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Your FaxNova API Key

  schemas:
    SendFaxRequest:
      type: object
      required:
        - to
        - fileUrl
      properties:
        to:
          type: string
          example: "+15551234567"
          description: Destination phone number in E.164 format.
        fileUrl:
          type: string
          format: uri
          example: "https://example.com/document.pdf"
          description: Publicly accessible URL of the PDF/document.
        from:
          type: string
          example: "+15557654321"
          description: Optional sender fax number. Defaults to provider configuration.
        provider:
          type: string
          enum: [sinch, telnyx]
          example: "telnyx"
          description: Optional provider override. Defaults to configured default provider.
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata for correlation, billing, or tagging.
        correlationId:
          type: string
          description: Optional client-provided correlation ID.

    SendFaxResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        faxId:
          type: string
          format: uuid
        providerFaxId:
          type: string
        provider:
          type: string
          enum: [sinch, telnyx]
        status:
          type: string
          example: "queued"
        correlationId:
          type: string
        residencyZone:
          type: string
          example: "us-east-tribal"
        sovereignty:
          type: string
          example: "US-only"

    FaxStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        faxId:
          type: string
        providerFaxId:
          type: string
        provider:
          type: string
          enum: [sinch, telnyx]
        status:
          type: string
          enum: [queued, sending, delivered, failed]
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
        residencyZone:
          type: string
        sovereignty:
          type: string

    FaxSummary:
      type: object
      properties:
        faxId:
          type: string
        provider:
          type: string
        status:
          type: string
          enum: [queued, sending, delivered, failed]
        createdAt:
          type: string
          format: date-time
        correlationId:
          type: string

    FaxListResponse:
      type: object
      properties:
        success:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/FaxSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    DeleteFaxResponse:
      type: object
      properties:
        success:
          type: boolean
        faxId:
          type: string
        status:
          type: string
          example: "deleted"

    ProviderConfigResponse:
      type: object
      properties:
        success:
          type: boolean
        defaultProvider:
          type: string
          enum: [sinch, telnyx]
        availableProviders:
          type: array
          items:
            type: string
            enum: [sinch, telnyx]
        fallbackEnabled:
          type: boolean
        residencyZones:
          type: array
          items:
            type: object
            properties:
              zone:
                type: string
              description:
                type: string
              providers:
                type: array
                items:
                  type: string

    WebhookEvent:
      type: object
      description: Normalized webhook payload from Sinch or Telnyx.
      properties:
        provider:
          type: string
          enum: [sinch, telnyx]
        eventType:
          type: string
          example: "fax.delivered"
        providerFaxId:
          type: string
        faxId:
          type: string
        status:
          type: string
          enum: [queued, sending, delivered, failed]
        timestamp:
          type: string
          format: date-time
        rawPayload:
          type: object
          additionalProperties: true

    WebhookAckResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        userId:
          type: string

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        userId:
          type: string

    AuditAgentRequest:
      type: object
      properties:
        repoUrl:
          type: string
          format: uri
        branch:
          type: string
        context:
          type: string

    AuditAgentResponse:
      type: object
      properties:
        success:
          type: boolean
        findings:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [info, warning, critical]
              message:
                type: string
              file:
                type: string
              line:
                type: integer

    RoutingAgentRequest:
      type: object
      properties:
        to:
          type: string
        countryCode:
          type: string
        tier:
          type: string
          enum: [basic, pro, enterprise]

    RoutingAgentResponse:
      type: object
      properties:
        success:
          type: boolean
        provider:
          type: string
          enum: [sinch, telnyx]
        residencyZone:
          type: string
        sovereignty:
          type: string
        score:
          type: number

    TroubleshootingAgentRequest:
      type: object
      properties:
        faxId:
          type: string
        provider:
          type: string
        errorCode:
          type: string
        context:
          type: string

    TroubleshootingAgentResponse:
      type: object
      properties:
        success:
          type: boolean
        recommendations:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Validation error"
        code:
          type: string
          example: "BAD_REQUEST"
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
