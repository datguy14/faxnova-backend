openapi: 3.1.0
info:
  title: FaxNova API
  description: |
    Enterprise-grade Multi-Provider Fax Delivery API

    FaxNova provides a unified, residency-aware, multi-provider faxing platform
    with automatic failover, webhook normalization, and AI-powered routing.

    Designed for healthcare, legal, finance, government, and regulated industries.
  version: "1.1.0"
  contact:
    name: FaxNova Support
    email: support@faxnova.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development Server
  - url: https://api.faxnova.com
    description: Production Server

tags:
  - name: Fax
    description: Fax sending, status, and lifecycle operations
  - name: Configuration
    description: Provider configuration, routing, and residency metadata
  - name: Webhooks
    description: Inbound webhook handling (Sinch + Telnyx)
  - name: Auth
    description: Authentication and user management
  - name: Agents
    description: AI-powered internal agents (audit, routing, troubleshooting)

paths:
  /fax/send:
    post:
      summary: Send a Fax
      description: |
        Sends a fax using Sinch or Telnyx with automatic fallback and
        residency-aware routing. Supports provider override and metadata tagging.
      tags: [Fax]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFaxRequest'
      responses:
        '200':
          description: Fax queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendFaxResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fax/status/{id}:
    get:
      summary: Get Fax Status
      description: Retrieves provider-aware fax status with normalized metadata.
      tags: [Fax]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Internal FaxNova fax ID
      responses:
        '200':
          description: Fax status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaxStatusResponse'
        '404':
          description: Fax not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fax:
    get:
      summary: List Faxes
      description: Paginated fax listing with filters.
      tags: [Fax]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, sending, delivered, failed]
        - name: provider
          in: query
          schema:
            type: string
            enum: [sinch, telnyx]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Fax list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaxListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fax/{id}:
    delete:
      summary: Delete Fax
      description: Soft-delete or cancel a fax depending on provider status.
      tags: [Fax]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fax deleted or cancel requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFaxResponse'
        '404':
          description: Fax not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fax/providers:
    get:
      summary: List Providers
      description: Returns provider configuration, residency zones, and routing metadata.
      tags: [Configuration]
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Provider configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfigResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fax/webhook:
    post:
      summary: Webhook Receiver
      description: Receives normalized webhooks from Sinch or Telnyx.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Webhook acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAckResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Login
      description: Authenticate and receive a JWT.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      summary: Register
      description: Create a new user account.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /agents/audit-code:
    post:
      summary: Run Code Audit Agent
      description: Submit code or metadata for automated analysis.
      tags: [Agents]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditAgentRequest'
      responses:
        '200':
          description: Audit results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAgentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /agents/route:
    post:
      summary: Run Routing Agent
      description: Residency-aware, provider-aware routing decision engine.
      tags: [Agents]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingAgentRequest'
      responses:
        '200':
          description: Routing decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingAgentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /agents/troubleshoot:
    post:
      summary: Run Troubleshooting Agent
      description: AI-powered troubleshooting for failed fax deliveries.
      tags: [Agents]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TroubleshootingAgentRequest'
      responses:
        '200':
          description: Troubleshooting insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TroubleshootingAgentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Your FaxNova API Key

  schemas:
    SendFaxRequest:
      type: object
      required:
        - to
        - fileUrl
      properties:
        to:
          type: string
          example: "+15551234567"
          description: Destination phone number in E.164 format.
        fileUrl:
          type: string
          format: uri
          example: "https://example.com/document.pdf"
          description: Publicly accessible URL of the PDF/document.
        from:
          type: string
          example: "+15557654321"
          description: Optional sender fax number. Defaults to provider configuration.
        provider:
          type: string
          enum: [sinch, telnyx]
          example: "telnyx"
          description: Optional provider override. Defaults to configured default provider.
        metadata:
          type: object
          additionalProperties: true
          description: Optional metadata for correlation, billing, or tagging.
        correlationId:
          type: string
          description: Optional client-provided correlation ID.

    SendFaxResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        faxId:
          type: string
          format: uuid
        providerFaxId:
          type: string
        provider:
          type: string
          enum: [sinch, telnyx]
        status:
          type: string
          example: "queued"
        correlationId:
          type: string
        residencyZone:
          type: string
          example: "us-east-tribal"
        sovereignty:
          type: string
          example: "US-only"

    FaxStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        faxId:
          type: string
        providerFaxId:
          type: string
        provider:
          type: string
          enum: [sinch, telnyx]
        status:
          type: string
          enum: [queued, sending, delivered, failed]
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
        residencyZone:
          type: string
        sovereignty:
          type: string

    FaxSummary:
      type: object
      properties:
        faxId:
          type: string
        provider:
          type: string
          enum: [sinch, telnyx]
        status:
          type: string
          enum: [queued, sending, delivered, failed]
        createdAt:
          type: string
          format: date-time
        correlationId:
          type: string

    FaxListResponse:
      type: object
      properties:
        success:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/FaxSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    DeleteFaxResponse:
      type: object
      properties:
        success:
          type: boolean
        faxId:
          type: string
        status:
          type: string
          example: "deleted"

    ProviderConfigResponse:
      type: object
      properties:
        success:
          type: boolean
        defaultProvider:
          type: string
          enum: [sinch, telnyx]
        availableProviders:
          type: array
          items:
            type: string
            enum: [sinch, telnyx]
        fallbackEnabled:
          type: boolean
        residencyZones:
          type: array
          items:
            type: object
            properties:
              zone:
                type: string
              description:
                type: string
              providers:
                type: array
                items:
                  type: string

    WebhookEvent:
      type: object
      description: Normalized webhook payload from Sinch or Telnyx.
      properties:
        provider:
          type: string
          enum: [sinch, telnyx]
        eventType:
          type: string
          example: "fax.delivered"
        providerFaxId:
          type: string
        faxId:
          type: string
        status:
          type: string
          enum: [queued, sending, delivered, failed]
        timestamp:
          type: string
          format: date-time
        rawPayload:
          type: object
          additionalProperties: true

    WebhookAckResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        userId:
          type: string

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        userId:
          type: string

    AuditAgentRequest:
      type: object
      properties:
        repoUrl:
          type: string
          format: uri
        branch:
          type: string
        context:
          type: string

    AuditAgentResponse:
      type: object
      properties:
        success:
          type: boolean
        findings:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [info, warning, critical]
              message:
                type: string
              file:
                type: string
              line:
                type: integer

    RoutingAgentRequest:
      type: object
      properties:
        to:
          type: string
        countryCode:
          type: string
        tier:
          type: string
          enum: [basic, pro, enterprise]

    RoutingAgentResponse:
      type: object
      properties:
        success:
          type: boolean
        provider:
          type: string
          enum: [sinch, telnyx]
        residencyZone:
          type: string
        sovereignty:
          type: string
        score:
          type: number

    TroubleshootingAgentRequest:
      type: object
      properties:
        faxId:
          type: string
        provider:
          type: string
          enum: [sinch, telnyx]
        errorCode:
          type: string
        context:
          type: string

    TroubleshootingAgentResponse:
      type: object
      properties:
        success:
          type: boolean
        recommendations:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Validation error"
        code:
          type: string
          example: "BAD_REQUEST"
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
