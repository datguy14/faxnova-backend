name: Audit Agent

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest

    env:
      AUDIT_AGENT_URL: ${{ secrets.AUDIT_AGENT_URL }}
      AUDIT_AGENT_KEY: ${{ secrets.AUDIT_AGENT_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Audit Agent
        id: audit
        run: |
          echo "Running FaxNova Audit Agent..."

          RESPONSE=$(curl -s -X POST "$AUDIT_AGENT_URL" \
            -H "Authorization: Bearer $AUDIT_AGENT_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"path\":\"src/\",\"mode\":\"analyze\"}")

          echo "Raw response:"
          echo "$RESPONSE"

          RESPONSE_ESCAPED=$(echo "$RESPONSE" | jq -Rs .)
          echo "response=$RESPONSE_ESCAPED" >> $GITHUB_OUTPUT

      - name: Parse audit results
        id: parse
        run: |
          RAW=${{ steps.audit.outputs.response }}
          RESPONSE=$(echo "$RAW" | jq -r .)

          CRITICAL=$(echo "$RESPONSE" | jq '.issues | map(select(.severity == "critical")) | length')

          echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: audit-agent
          message: |
            ### 🔍 FaxNova Audit Agent Report
            **Critical Issues:** ${{ steps.parse.outputs.critical_count }}

            **Raw Output:**
            ```
            ${{ steps.audit.outputs.response }}
            ```

      - name: Fail on critical issues
        if: steps.parse.outputs.critical_count != '0'
        run: |
          echo "Critical issues found. Failing the build."
          exit 1
